buildscript {
    repositories {
        google()
        jcenter()
    }

    dependencies {
         classpath 'com.android.tools.build:gradle:7.1.0'
    }
}

repositories {
    google()
    jcenter()
}

apply plugin: 'com.android.application'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.appcompat:appcompat:1.4.0'
}

def getVersionNameFromManifest() {
    def manifestPaths = ['AndroidManifest.xml', 'src/main/AndroidManifest.xml']
    for (String path : manifestPaths) {
        def manifestFile = file(path)
        if (manifestFile.exists()) {
            def xml = new XmlSlurper().parse(manifestFile)
            return xml.'@android:versionName'.text()
        }
    }
    return "1.0"
}

def myVersionName = getVersionNameFromManifest()

android {
    /*******************************************************
     * The following variables:
     * - androidBuildToolsVersion,
     * - androidCompileSdkVersion
     * - qt5AndroidDir - holds the path to qt android files
     *                   needed to build any Qt application
     *                   on Android.
     *
     * are defined in gradle.properties file. This file is
     * updated by QtCreator and androiddeployqt tools.
     * Changing them manually might break the compilation!
     *******************************************************/

    compileSdkVersion androidCompileSdkVersion.toInteger()
    buildToolsVersion "30.0.3"

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qt5AndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qt5AndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qt5AndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs','../../../../commonAndroidLibs']
       }
    }

    tasks.withType(JavaCompile) {
        options.incremental = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }

    // Do not compress Qt binary resources file
    aaptOptions {
        noCompress 'rcc'
    }

    defaultConfig {
        resConfig "en"
        minSdkVersion = qMinSdkVersion
        targetSdkVersion = qTargetSdkVersion

        ndk{
            abiFilters  'armeabi-v7a'
        }
    }

    final Properties props = new Properties()
    props.load(new FileInputStream(file("signing.properties")))
    signingConfigs {
        release{
            keyAlias props['KEY_ALIAS']
            keyPassword props['KEY_PASSWORD']
            storeFile file(props['KEYSTORE_FILE'])
            storePassword props['KEYSTORE_PASSWORD']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release

            lintOptions {
                checkReleaseBuilds true
                abortOnError true
            }

            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
           if (variant.buildType.name == 'release') {
                outputFileName = "qtforcamera_v${myVersionName}.apk"

                variant.assembleProvider.get().doLast {
                    copy {
                        duplicatesStrategy = 'include'
                        include '**/*.apk'
                        from variant.getPackageApplicationProvider().get().outputDirectory.getAsFile().get().getPath() + File.separator
                        into "../../../target/android"
                        rename { String fileName ->outputFileName}
                    }
                }
           }
        }
    }
}
